<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pessimiste</title>
  <meta name="description" content="Pessimiste / Demo MMXXV. Listen on Bandcamp, watch live on YouTube, follow on Facebook and Instagram." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="logo-section">
      <img src="assets/logo.svg" alt="Pessimiste" class="logo" width="260" height="173" />
    </header>

    <section class="card" aria-label="Demo MMXXV, released September 10, 2025">
      <div class="embed-wrap embed-wrap--bandcamp">
        <iframe
          style="border: 0; width: 100%; height: 220px;"
          src="https://bandcamp.com/EmbeddedPlayer/album=3127812428/size=large/bgcol=181326/linkcol=c084fc/tracklist=true/artwork=small/transparent=true/"
          seamless
          loading="lazy"
          title="Demo MMXXV by Pessimiste on Bandcamp"
        >
          <a href="https://pessimiste.bandcamp.com/album/demo-mmxxv">Demo MMXXV by Pessimiste</a>
        </iframe>
      </div>
    </section>

    <section class="card" aria-label="First show, full set, live at Elbo Room, Oakland">
      <div class="embed-wrap embed-wrap--video">
        <iframe
          src="https://www.youtube.com/embed/vO-551IVDGk"
          title="PESSIMISTE, first show entire set, live at Elbo Room, Oakland"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          loading="lazy"
        ></iframe>
      </div>
    </section>

    <section class="social-section" aria-label="Follow Pessimiste">
      <p class="caption">follow</p>
      <div class="social-links">
        <a class="social-btn" href="https://www.facebook.com/pessimiste.band" target="_blank" rel="noopener noreferrer">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
          <span>Facebook</span>
        </a>
        <a class="social-btn" href="https://www.instagram.com/pessimiste.band/" target="_blank" rel="noopener noreferrer">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <circle cx="17.5" cy="6.5" r="1" fill="#f8fafc" stroke="none"/>
          </svg>
          <span>Instagram</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
